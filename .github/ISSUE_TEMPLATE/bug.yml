name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or private payloads. Report security issues through the private advisory link instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and why it is a problem.
      placeholder: A concise description of the failure.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command or browser steps and sanitized input.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 / Chrome 140, Ubuntu 24.04 / CLI, etc.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Browser tool
        - Rust core
        - Build, CI, or release
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets and personal data from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
