name: Release

'on':
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  preflight:
    name: Reject an existing release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          case "$status" in
            404) ;;
            200) echo "Release ${RELEASE_TAG} already exists; assets are immutable." >&2; exit 1 ;;
            *) echo "Release lookup returned HTTP ${status}." >&2; exit 1 ;;
          esac

  validate:
    name: Validate version metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      - name: Validate tag, package versions, and changelog
        id: release
        env:
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          set -euo pipefail
          ruby scripts/validate_release.rb --tag "$RELEASE_TAG" --notes "$NOTES_PATH"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] || { echo "tag does not identify the workflow commit" >&2; exit 1; }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload validated release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  supply-chain:
    permissions:
      contents: read
    uses: ./.github/workflows/supply-chain.yml

  cli:
    name: CLI ${{ matrix.target }}
    needs: [validate, quality, supply-chain]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: tinkora-encoding
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: tinkora-encoding
          - runner: macos-15
            target: x86_64-apple-darwin
            binary: tinkora-encoding
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: tinkora-encoding.exe
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fixed Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup target add "$TARGET" --toolchain 1.95.0

      - name: Build and smoke-test CLI
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo +1.95.0 build --release --locked -p encoding_toolbox_cli --target "$TARGET"
          runner_arch="$(uname -m)"
          case "$runner_arch:$TARGET" in
            x86_64:x86_64-*|amd64:x86_64-*|arm64:aarch64-*|aarch64:aarch64-*)
              "target/$TARGET/release/$BINARY" --version
              ;;
            *)
              echo "Cross-compiled $TARGET; native smoke test is not available on $runner_arch."
              ;;
          esac

      - name: Package CLI
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          fi
          package="encoding-toolbox-cli-${TARGET}-v${VERSION}"
          staging="$runner_temp/$package"
          mkdir -- "$staging"
          cp -- "target/$TARGET/release/$BINARY" "$staging/"
          cp -- LICENSE README.md README.zh-CN.md "$staging/"
          tar -czf "$runner_temp/${package}.tar.gz" -C "$runner_temp" "$package"

      - name: Upload CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-asset-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/encoding-toolbox-cli-${{ matrix.target }}-v${{ needs.validate.outputs.version }}.tar.gz
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  web:
    name: Web application
    needs: [validate, quality, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and WASM tooling
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-pack --version 0.15.0 --locked

      - name: Build and package Web application
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          scripts/build_web.sh
          package="encoding-toolbox-web-v${VERSION}"
          mkdir -p "staging/$package"
          cp -R dist/. "staging/$package/"
          cp LICENSE README.md README.zh-CN.md "staging/$package/"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          find staging -exec touch -h -d "@${epoch}" {} +
          TZ=UTC tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/${package}.tar.gz" -C staging "$package"

      - name: Upload Web archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-asset-web
          path: ${{ runner.temp }}/encoding-toolbox-web-v${{ needs.validate.outputs.version }}.tar.gz
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  gather:
    name: Gather release source assets
    needs: [validate, cli, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-asset-*
          path: release-source
          merge-multiple: true

      - name: Validate source asset set
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(find release-source -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 5
          jq -n --arg commit "$GITHUB_SHA" --arg version "$VERSION" \
            '{commit: $commit, version: $version}' > release-source/release-metadata.json

      - name: Upload release source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-source
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  evidence:
    name: Generate checksums, SBOM, and license evidence
    needs: [validate, gather, preflight]
    permissions:
      contents: read
    uses: Tinkora/.github/.github/workflows/reusable-release.yml@e80d6099799b9d372525f1639aa601504fe8d52b
    with:
      source-artifact-name: release-source-${{ github.run_id }}-${{ github.run_attempt }}
      version: ${{ needs.validate.outputs.version }}
      publish: false

  attest:
    name: Attest release archives
    needs: [validate, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.evidence.outputs.candidate-artifact-name }}
          path: release-candidate

      - name: Verify candidate checksums
        run: cd release-candidate && sha256sum --check --strict SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/*.tar.gz

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/*.tar.gz
          sbom-path: release-candidate/SBOM.spdx.json

  verify:
    name: Verify release candidate
    needs: [validate, evidence, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.evidence.outputs.candidate-artifact-name }}
          path: release-candidate

      - name: Verify paths, files, and checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          candidate=release-candidate
          if find "$candidate" -type l -print -quit | grep -q .; then
            echo "Release candidate contains a symbolic link" >&2
            exit 1
          fi
          expected=(
            "encoding-toolbox-cli-x86_64-unknown-linux-gnu-v${VERSION}.tar.gz"
            "encoding-toolbox-cli-aarch64-apple-darwin-v${VERSION}.tar.gz"
            "encoding-toolbox-cli-x86_64-apple-darwin-v${VERSION}.tar.gz"
            "encoding-toolbox-cli-x86_64-pc-windows-msvc-v${VERSION}.tar.gz"
            "encoding-toolbox-web-v${VERSION}.tar.gz"
            SHA256SUMS
            SBOM.spdx.json
            LICENSES.json
          )
          for name in "${expected[@]}"; do
            test -f "$candidate/$name" || { echo "Missing release asset: $name" >&2; exit 1; }
          done
          test "$(find "$candidate" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8
          (cd "$candidate" && sha256sum --check --strict SHA256SUMS)

  release:
    name: Publish GitHub Release
    needs: [validate, evidence, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.evidence.outputs.candidate-artifact-name }}
          path: release-candidate

      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-notes

      - name: Reverify and publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          (cd release-candidate && sha256sum --check --strict SHA256SUMS)
          mapfile -d '' assets < <(find release-candidate -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          test "${#assets[@]}" = 8
          release_id="$(gh api \
            --method POST \
            "repos/${GH_REPO}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$TAG" \
            -f body="$(cat release-notes/release-notes.md)" \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')"
          gh release upload "$TAG" "${assets[@]}"
          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F draft=false --jq '.draft' | grep -qx false
