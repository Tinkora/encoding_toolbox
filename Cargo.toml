[workspace]
members = [
  "crates/encoding_toolbox_core",
  "crates/encoding_toolbox_cli",
  "crates/encoding_toolbox_web",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Tinkora/encoding_toolbox"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
base64 = "0.22"
data-encoding = "2.6"
sha2 = "0.10"
blake3 = "1.8"
md-5 = "0.10"
hmac = "0.13"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
